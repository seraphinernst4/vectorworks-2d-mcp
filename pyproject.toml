[project]
name = "vectorworks-2d-mcp"
version = "0.4.1"
description = "Keystone for Vectorworks: MCP server for exact, well-organised 2D drawing in Vectorworks (macOS, pure Python)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "shapely>=2.0", "matplotlib>=3.8", "numpy>=1.26"]

[project.scripts]
vwmcp = "vwmcp.server:main"

[project.urls]
Homepage = "https://github.com/seraphinernst4/vectorworks-2d-mcp"
Issues = "https://github.com/seraphinernst4/vectorworks-2d-mcp/issues"
Upstream = "https://github.com/giorgiomoroder/vectorworks-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vwmcp"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.hatch.build.targets.wheel.force-include]
"vw-plugin/vwmcp/vwmcp_bridge.py" = "vwmcp/_plugin/vwmcp_bridge.py"
