# Dependencies of the Claude Desktop extension (server.type "uv"): Claude
# Desktop installs them with uv. The server code ships as source in server/.
[project]
name = "keystone-vectorworks"
version = "@VERSION@"
description = "Keystone for Vectorworks (Claude Desktop extension)"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "shapely>=2.0", "matplotlib>=3.8", "numpy>=1.26"]

[tool.uv]
package = false
