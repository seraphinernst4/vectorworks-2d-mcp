# Dependencies of the Claude Desktop extension: server/index.js runs
# server/main.py with uv, which installs these. The code ships in server/.
[project]
name = "keystone-vectorworks"
version = "@VERSION@"
description = "Keystone for Vectorworks (Claude Desktop extension)"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "shapely>=2.0", "matplotlib>=3.8", "numpy>=1.26"]

[tool.uv]
package = false
